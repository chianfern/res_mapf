default_install_hook_types: [ "pre-commit", "commit-msg" ]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.2
    hooks:
      # Run the formatter.
      - id: ruff-format
        stages: [ pre-commit ]
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
        stages: [ pre-commit ]

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.5
    hooks:
      - id: uv-lock
        stages: [ pre-commit ]
        files: res_mapf/pyproject.toml
        args: [--project, res_mapf]

  - repo: local
    hooks:
      - id: mypy
        name: "Static type checker"
        entry: bash -c "cd res_mapf && uv run mypy ."
        language: system
        types: [ python ]
        pass_filenames: false

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [ commit-msg ]
        additional_dependencies: [ '@commitlint/config-conventional' ]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: "License inserter"
        files: .*py$
        args:
          - --license-filepath=license_header.txt
          - --comment-style=#
          - --use-current-year
        exclude: |
          (?x)^(
            res_mapf/packages/res_mapf_planning/src/res_mapf_planning/cbs/|
            res_mapf/packages/res_pybullet/src/res_pybullet/simulation/
          )
        stages: [ pre-commit ]
