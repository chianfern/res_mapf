name: Python CI

# Test and lint on pull requests, the default branch and tags
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  build:
    name: python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v6

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.8"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install the project
        run: uv sync --all-packages --all-extras --dev
        env:
          UV_PROJECT: res_mapf

      - name: Run lint
        run: cd res_mapf && uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest
        env:
          UV_PROJECT: res_mapf
